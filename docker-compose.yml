version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: truthlens-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - truthlens-network

  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: truthlens-ai-service
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - ENVIRONMENT=production
      - SEARCH_PROVIDER=duckduckgo
      - LLM_PROVIDER=fallback
      - INTERNAL_API_SECRET=dev-secret-internal-truthlens
    networks:
      - truthlens-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: truthlens-server
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - CLIENT_URL=http://localhost
      - MONGODB_URI=mongodb://mongodb:27017/truthlens
      - AI_SERVICE_URL=http://ai-service:8000
      - INTERNAL_API_SECRET=dev-secret-internal-truthlens
      - JWT_SECRET=dev-secret-jwt-truthlens-key-2026
    depends_on:
      - mongodb
      - ai-service
    networks:
      - truthlens-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: truthlens-client
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - server
    networks:
      - truthlens-network

volumes:
  mongodb_data:
    driver: local

networks:
  truthlens-network:
    driver: bridge
